# yaml-language-server: $schema=https://raw.githubusercontent.com/ppsdang/ai-workspace/main/schema/workspace.schema.json
# ai-workspace manifest — the only file a human writes.
# Everything else in the workspace is generated by /ai-workspace:init and can be rebuilt.
version: 1
mode: multi                # multi: codebases cloned into codebase/<name> | single: this repository only
worktrees: false           # true: each task gets its own checkout under work/<KEY>/<name> (parallel tasks)

workspace:
  name: Example Shop

# Where tasks come from. type: jira | github | trello | markdown | custom | none
# Secrets come from environment variables only (e.g. JIRA_API_TOKEN, TRELLO_TOKEN).
tracker:
  type: jira
  base_url: https://example.atlassian.net
  project: SHOP
  via: mcp                 # jira/custom: mcp | api (jira) | command (custom)
  statuses:                # used at plan approval (start) and after MRs open (review)
    start: In Progress
    review: In Review
  # --- other tracker examples -------------------------------------------------
  # type: github    repo: owner/repo                   statuses = labels
  # type: trello                                       statuses = list names
  # type: markdown  path: backlog                      backlog/task1.md, task2.md ...
  # type: custom    via: command
  #                 commands:
  #                   fetch: "./tools/tracker fetch {key}"
  #                   comment: "./tools/tracker comment {key}"
  #                   transition: "./tools/tracker move {key} {status}"
  # type: custom    via: mcp   mcp_server: my-tracker
  # type: none                                         paste tasks as text

# Where code is hosted. type: github | gitlab
git_host:
  type: gitlab
  default_branch: main
  draft: false             # open MRs/PRs as drafts
  sync: rebase             # rebase | merge: how to catch up with a moved base branch before shipping

codebases:
  - name: frontend         # folder name under codebase/ (letters, digits, . _ -)
    url: git@gitlab.com:example/shop-frontend.git
    # branch: develop       # base branch, overrides git_host.default_branch
    # tdd: when-tests-exist # strict | when-tests-exist | off
  - name: backend
    url: git@gitlab.com:example/shop-backend.git
  # Monorepo: one repository, several parts analysed and tested separately (one branch/MR per repository)
  # - name: platform
  #   url: git@gitlab.com:example/platform.git
  #   components:
  #     - { name: api, dir: services/api }
  #     - { name: web, dir: apps/web }
  #
  # Single-repo mode (mode: single): exactly one codebase, no url
  # - name: shop
  #   path: "."

branching:
  pattern: "{type}/{key}-{slug}"   # type = feature | fix | chore

protected_branches: [main, master, develop, "release/*"]

gates:
  quick_fix: end           # end = one approval before shipping; both = plan approval too

ci:
  max_rounds: 2            # CI-fix pushes per task before handing over to a human

guard:
  confirm_outward: true    # ask before every push, MR/PR and tracker update
